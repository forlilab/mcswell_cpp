title = "TOML configuraiton file for MCSwell"

[io]
save_path="example"

[receptor]
path=["example/5pti.cif"]

# This part is commented out as the test does not have a ligand
# [ligand]
# small_molecule_path=["3std_monomer_clean_ligand.sdf"]
# small_molecule_forcefield=["gaff2"]


[simulation_parameters]
n_frames=1
n_snapshots=2000
# Long enough for the windows around bulk mu, where N decorrelates over ~10M
# steps, and for the slowest windows up to mu = -4 to become stationary
# (~15-25M steps with the default pre-filled start). Check n_waters_trace.png
# and raise n_equilibration_steps if a window is flagged.
n_gcmc_steps=100000000
n_equilibration_steps=20000000
distance_cutoff=9.0

[mu_range]
# Up to ~3 kcal/mol above bulk mu (-6.87 for TIP4P). Higher windows keep
# compressing water past bulk density and do not equilibrate in a feasible run.
start=-38.0
stop=-4.0
step=1.0

[gci]
peak_percentile=90.0

[simulation_box]
#27.985094    9.3914385   0.24150422
spacing=0.375
center_x=27.985094
center_y=9.3914385
center_z=0.24150422
x_size=24.0
y_size=24.0
z_size=24.0
